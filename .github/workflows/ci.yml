name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
      - name: Smoke-test the sweep
        run: python -m src.run_sweep --quick --workers 2 --output results/quick/value_of_game.json --figures results/quick/figures --tables results/quick/tables.md
      - name: Smoke-test the extension study
        run: python -m src.run_extensions --quick --workers 2

  hardware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ngspice and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ngspice kicad-symbols kicad-footprints
          python -m pip install -r hardware/requirements.txt
      - name: Simulate the board and redraw the hardware figures
        run: |
          python hardware/scripts/run_spice.py
          python hardware/scripts/draw_schematic.py
          python hardware/scripts/board_3d.py
      - name: Regenerate and check the KiCad netlist and BOM
        run: |
          python hardware/kicad/make_netlist.py
          git diff --exit-code hardware/kicad/ascam1.net hardware/kicad/NETLIST.md hardware/bom.csv

  no-em-dashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on em dashes
        run: |
          if grep -rInP "\x{2014}" --include='*.md' --include='*.py' --include='*.yml' --include='*.cff' .; then
            echo "Replace the em dashes above with a comma, colon, or period."
            exit 1
          fi
